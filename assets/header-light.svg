<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Josias Tomas Ñañez, DevOps / Cloud Engineer Jr">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e3ebe8" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#ffffff"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#d5e0dc"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#0f7b6c" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" letter-spacing="2">$ whoami</text>
    <text x="62" y="146" fill="#17201d" font-size="52" font-weight="700">Josias Tomas Ñañez</text>
    <text x="64" y="190" fill="#3b4a45" font-size="24">DevOps / Cloud Engineer Jr</text>
    <text x="64" y="232" fill="#5d6b66" font-size="17">AWS Certified Cloud Practitioner · Córdoba, Argentina</text>
  </g>

  <!-- pipeline -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
    <path d="M770 150H1130" stroke="#c9d8d3" stroke-width="2"/>
    <path d="M770 150H1058" stroke="#0f7b6c" stroke-width="2"/>
    <g>
      <circle cx="770" cy="150" r="9" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <circle cx="770" cy="150" r="3.5" fill="#0f7b6c"/>
      <text x="770" y="120" fill="#5d6b66" text-anchor="middle">plan</text>
    </g>
    <g>
      <circle cx="842" cy="150" r="9" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <circle cx="842" cy="150" r="3.5" fill="#0f7b6c"/>
      <text x="842" y="182" fill="#5d6b66" text-anchor="middle">build</text>
    </g>
    <g>
      <circle cx="914" cy="150" r="9" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <circle cx="914" cy="150" r="3.5" fill="#0f7b6c"/>
      <text x="914" y="120" fill="#5d6b66" text-anchor="middle">test</text>
    </g>
    <g>
      <circle cx="986" cy="150" r="9" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
