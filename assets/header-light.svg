      <text x="986" y="182" fill="#5d6b66" text-anchor="middle">deploy</text>
    </g>
    <g>
      <circle cx="1058" cy="150" r="9" fill="#ffffff" stroke="#0f7b6c" stroke-width="2"/>
      <circle cx="1058" cy="150" r="3.5" fill="#0f7b6c"/>
      <text x="1058" y="120" fill="#5d6b66" text-anchor="middle">observe</text>
    </g>
    <g>
      <circle cx="1130" cy="150" r="9" fill="#ffffff" stroke="#c9d8d3" stroke-width="2" stroke-dasharray="3 3"/>
