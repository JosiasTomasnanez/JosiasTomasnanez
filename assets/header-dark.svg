      <circle cx="770" cy="150" r="3.5" fill="#3fc1ab"/>
      <text x="770" y="120" fill="#93a39d" text-anchor="middle">plan</text>
    </g>
    <g>
      <circle cx="842" cy="150" r="9" fill="#0d1117" stroke="#3fc1ab" stroke-width="2"/>
