<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Josias Tomas Ñañez — DevOps / Cloud Engineer Jr">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2a2c" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#0d1117"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#21363a"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#3fc1ab" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" letter-spacing="2">$ whoami</text>
    <text x="62" y="146" fill="#e6eeeb" font-size="52" font-weight="700">Josias Tomas Ñañez</text>
    <text x="64" y="190" fill="#b8c7c2" font-size="24">DevOps / Cloud Engineer Jr</text>
    <text x="64" y="232" fill="#7f918b" font-size="17">AWS Certified Cloud Practitioner · Córdoba, Argentina</text>
  </g>

  <!-- pipeline -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">
    <path d="M770 150H1130" stroke="#2b4a4c" stroke-width="2"/>
